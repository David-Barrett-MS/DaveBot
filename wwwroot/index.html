<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DaveBot Chat</title>
    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #1f2937;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        .subtle {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        select,
        textarea,
        button {
            font: inherit;
        }

        select,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0.65rem;
            background: #fff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            background: #93c5fd;
            cursor: wait;
        }

        #micBtn {
            background: #0f766e;
        }

        #micBtn.recording {
            background: #b91c1c;
        }

        .response {
            margin-top: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.9rem;
            background: #f9fafb;
            white-space: pre-wrap;
        }

        .error {
            color: #b91c1c;
            margin-top: 0.75rem;
        }

        .debug {
            margin-top: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0.9rem;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            min-height: 120px;
        }

        .speech {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f8fafc;
        }

        .speech-status {
            color: #374151;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <h1>DaveBot</h1>
    <p class="subtle">Foundry Local chat + STT endpoint (TTS to be added later).</p>

    <div class="row">
        <label for="model"><strong>Model</strong></label>
    </div>
    <div class="row">
        <select id="model">
            <option value="qwen3-1.7b">Qwen3 1.7B</option>
            <option value="phi-4-mini">Phi-4 Mini</option>
        </select>
    </div>

    <div class="row">
        <label for="message"><strong>Message</strong></label>
    </div>
    <div class="row">
        <textarea id="message" placeholder="Ask DaveBot something..."></textarea>
    </div>

    <div class="row">
        <button id="sendBtn" type="button">Send</button>
        <button id="micBtn" type="button">Start Mic</button>
    </div>

    <div class="speech">
        <strong>Transcript</strong>
        <div id="transcript">(none)</div>
        <div id="speechStatus" class="speech-status">Microphone idle.</div>
    </div>

    <div id="error" class="error"></div>
    <div id="response" class="response" hidden></div>
    <div id="debug" class="debug"></div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const model = document.getElementById('model');
        const message = document.getElementById('message');
        const response = document.getElementById('response');
        const error = document.getElementById('error');
        const debug = document.getElementById('debug');
        const micBtn = document.getElementById('micBtn');
        const transcript = document.getElementById('transcript');
        const speechStatus = document.getElementById('speechStatus');

        let mediaStream = null;
        let audioContext = null;
        let sourceNode = null;
        let processorNode = null;
        let muteNode = null;
        let speechSessionId = null;
        let isRecording = false;
        let uploadChain = Promise.resolve();
        let uploadFailureMessage = null;

        function writeDebug(text) {
            const line = `[${new Date().toLocaleTimeString()}] ${text}`;
            debug.textContent += `${line}\n`;
            debug.scrollTop = debug.scrollHeight;
            console.log(line);
        }

        writeDebug('UI ready.');

        function setSpeechStatus(text) {
            speechStatus.textContent = text;
            writeDebug(text);
        }

        sendBtn.addEventListener('click', async () => {
            error.textContent = '';
            response.hidden = true;
            response.textContent = '';

            const text = message.value.trim();
            if (!text) {
                error.textContent = 'Message is required.';
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                const payload = {
                    message: text,
                    model: model.value
                };

                writeDebug(`Sending POST /api/chat payload: ${JSON.stringify(payload)}`);
                const startTime = performance.now();

                const result = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const elapsedMs = Math.round(performance.now() - startTime);
                writeDebug(`Received HTTP ${result.status} from /api/chat in ${elapsedMs}ms`);

                const rawBody = await result.text();
                writeDebug(`Raw response body: ${rawBody || '(empty)'}`);

                let body = null;
                if (rawBody) {
                    try {
                        body = JSON.parse(rawBody);
                    } catch {
                        writeDebug('Response is not valid JSON.');
                    }
                }

                if (!result.ok) {
                    throw new Error(body?.detail || body?.error || rawBody || 'Request failed.');
                }

                response.hidden = false;
                response.textContent = body.message || '(empty response)';
                writeDebug(`Assistant response text length: ${(body.message || '').length}`);
            } catch (e) {
                error.textContent = e.message || 'Unexpected error.';
                writeDebug(`Request failed: ${error.textContent}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }
        });

        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                await stopMicrophoneCapture();
                return;
            }

            await startMicrophoneCapture();
        });

        async function startMicrophoneCapture() {
            const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
            if (!navigator.mediaDevices?.getUserMedia || !AudioContextCtor) {
                error.textContent = 'Browser does not support microphone recording.';
                setSpeechStatus('Microphone not supported in this browser.');
                return;
            }

            error.textContent = '';
            transcript.textContent = '(recording...)';
            response.hidden = true;
            response.textContent = '';
            uploadChain = Promise.resolve();
            uploadFailureMessage = null;

            try {
                setSpeechStatus('Requesting microphone access...');
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                audioContext = new AudioContextCtor({ sampleRate: 16000 });
                await audioContext.resume();

                const selectedSampleRate = Math.round(audioContext.sampleRate);
                setSpeechStatus(`Creating speech session (${selectedSampleRate} Hz mono PCM)...`);

                const sessionResult = await fetch('/api/speech/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sampleRate: selectedSampleRate,
                        channels: 1
                    })
                });

                const rawSessionBody = await sessionResult.text();
                let sessionBody = null;

                if (rawSessionBody) {
                    try {
                        sessionBody = JSON.parse(rawSessionBody);
                    } catch {
                        // ignored
                    }
                }

                if (!sessionResult.ok || !sessionBody?.sessionId) {
                    throw new Error(sessionBody?.error || rawSessionBody || 'Failed to create speech session.');
                }

                speechSessionId = sessionBody.sessionId;
                writeDebug(`Speech session ready: ${speechSessionId} (${sessionBody.sampleRate} Hz, ${sessionBody.channels} channel)`);

                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                muteNode = audioContext.createGain();
                muteNode.gain.value = 0;

                processorNode.onaudioprocess = (event) => {
                    if (!isRecording || !speechSessionId || uploadFailureMessage) {
                        return;
                    }

                    const input = event.inputBuffer.getChannelData(0);
                    const pcmBuffer = toPcm16Le(input);
                    queueChunkUpload(speechSessionId, pcmBuffer);
                };

                sourceNode.connect(processorNode);
                processorNode.connect(muteNode);
                muteNode.connect(audioContext.destination);

                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = 'Stop Mic';
                setSpeechStatus('Recording and streaming microphone audio (PCM)...');
            } catch (e) {
                error.textContent = e.message || 'Unable to start microphone.';
                setSpeechStatus(`Microphone start failed: ${error.textContent}`);
                await cancelSpeechSession();
                await cleanupMediaResources();
            }
        }

        function queueChunkUpload(sessionId, pcmBuffer) {
            uploadChain = uploadChain
                .then(async () => {
                    await uploadChunk(sessionId, pcmBuffer);
                })
                .catch((e) => {
                    uploadFailureMessage = e.message || 'Chunk upload failed.';
                    error.textContent = uploadFailureMessage;
                    writeDebug(`Chunk upload failed: ${uploadFailureMessage}`);
                });
        }

        async function stopMicrophoneCapture() {
            if (!isRecording) {
                return;
            }

            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = 'Start Mic';
            setSpeechStatus('Stopping microphone...');

            try {
                await uploadChain;

                if (uploadFailureMessage) {
                    throw new Error(uploadFailureMessage);
                }

                setSpeechStatus('Microphone stopped. Finalizing speech...');
                await finalizeSpeechSession();
            } catch (e) {
                error.textContent = e.message || 'Unable to finalize speech.';
                setSpeechStatus(`Speech processing failed: ${error.textContent}`);
                await cancelSpeechSession();
            } finally {
                await cleanupMediaResources();
            }
        }

        function toPcm16Le(float32Array) {
            const buffer = new ArrayBuffer(float32Array.length * 2);
            const view = new DataView(buffer);

            for (let i = 0; i < float32Array.length; i++) {
                const sample = Math.max(-1, Math.min(1, float32Array[i]));
                view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            }

            return buffer;
        }

        async function uploadChunk(sessionId, bytes) {
            writeDebug(`Uploading PCM chunk to session ${sessionId}. Bytes=${bytes.byteLength}`);

            const result = await fetch(`/api/speech/sessions/${encodeURIComponent(sessionId)}/chunks`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/octet-stream'
                },
                body: bytes
            });

            if (!result.ok) {
                const body = await result.text();
                throw new Error(body || `Chunk upload failed with HTTP ${result.status}`);
            }
        }

        async function finalizeSpeechSession() {
            if (!speechSessionId) {
                return;
            }

            const activeSessionId = speechSessionId;
            speechSessionId = null;

            writeDebug(`Finalizing speech session ${activeSessionId}...`);

            const result = await fetch(`/api/speech/sessions/${encodeURIComponent(activeSessionId)}/complete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chatModel: model.value
                })
            });

            const rawBody = await result.text();
            writeDebug(`Speech finalize HTTP ${result.status}: ${rawBody || '(empty)'}`);

            let body = null;
            if (rawBody) {
                try {
                    body = JSON.parse(rawBody);
                } catch {
                    // ignored
                }
            }

            if (!result.ok) {
                throw new Error(body?.detail || body?.error || rawBody || 'Speech finalization failed.');
            }

            transcript.textContent = body.transcript || '(empty transcript)';
            message.value = body.transcript || '';

            response.hidden = false;
            response.textContent = body.message || body.chat?.message || '(empty response)';
            setSpeechStatus('Speech processed successfully.');
        }

        async function cancelSpeechSession() {
            if (!speechSessionId) {
                return;
            }

            const activeSessionId = speechSessionId;
            speechSessionId = null;

            try {
                await fetch(`/api/speech/sessions/${encodeURIComponent(activeSessionId)}`, { method: 'DELETE' });
            } catch {
                // best effort
            }
        }

        async function cleanupMediaResources() {
            if (processorNode) {
                processorNode.disconnect();
            }

            if (sourceNode) {
                sourceNode.disconnect();
            }

            if (muteNode) {
                muteNode.disconnect();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            if (audioContext) {
                try {
                    await audioContext.close();
                } catch {
                    // ignore
                }
            }

            mediaStream = null;
            audioContext = null;
            sourceNode = null;
            processorNode = null;
            muteNode = null;
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = 'Start Mic';
        }
    </script>
</body>
</html>
